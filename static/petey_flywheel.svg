<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Center text -->
  <text x="640" y="350" text-anchor="middle" font-size="22" font-weight="600" fill="#222">The Petey Flywheel</text>
  <text x="640" y="378" text-anchor="middle" font-size="14" fill="#666">Each turn compounds the moat</text>

  <!-- Curved arrows (clockwise) -->
  <!-- Top -> Right -->
  <path d="M 729 185 Q 910 175 881 295" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="868" y="218" text-anchor="middle" font-size="13" fill="#666" font-style="italic">grows into</text>

  <!-- Right -> Bottom -->
  <path d="M 881 425 Q 910 545 729 535" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="868" y="508" text-anchor="middle" font-size="13" fill="#666" font-style="italic">trains</text>

  <!-- Bottom -> Left -->
  <path d="M 551 535 Q 370 545 399 425" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="412" y="508" text-anchor="middle" font-size="13" fill="#666" font-style="italic">enables</text>

  <!-- Left -> Top -->
  <path d="M 399 295 Q 370 175 551 185" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="412" y="218" text-anchor="middle" font-size="13" fill="#666" font-style="italic">users contribute back</text>

  <!-- Top: Schema Library -->
  <circle cx="640" cy="120" r="110" fill="#fafafa" stroke="#333" stroke-width="2.5"/>
  <text x="640" y="103" text-anchor="middle" font-size="18" font-weight="600" fill="#222">Schema Library</text>
  <text x="640" y="128" text-anchor="middle" font-size="13" fill="#555">Community-built</text>
  <text x="640" y="146" text-anchor="middle" font-size="13" fill="#555">200+ at launch</text>

  <!-- Right: Training Data -->
  <circle cx="970" cy="360" r="110" fill="#fafafa" stroke="#333" stroke-width="2.5"/>
  <text x="970" y="343" text-anchor="middle" font-size="18" font-weight="600" fill="#222">Training Data</text>
  <text x="970" y="368" text-anchor="middle" font-size="13" fill="#555">Schemas only —</text>
  <text x="970" y="386" text-anchor="middle" font-size="13" fill="#555">never user documents</text>

  <!-- Bottom: Schema-Gen Model (inverted to highlight proprietary IP) -->
  <circle cx="640" cy="600" r="110" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="640" y="583" text-anchor="middle" font-size="18" font-weight="600" fill="#fff">Schema-Gen Model</text>
  <text x="640" y="608" text-anchor="middle" font-size="13" fill="#ccc">Proprietary IP</text>
  <text x="640" y="626" text-anchor="middle" font-size="13" fill="#ccc">Drafts schemas in seconds</text>

  <!-- Left: Faster Onboarding -->
  <circle cx="310" cy="360" r="110" fill="#fafafa" stroke="#333" stroke-width="2.5"/>
  <text x="310" y="343" text-anchor="middle" font-size="18" font-weight="600" fill="#222">Faster Onboarding</text>
  <text x="310" y="368" text-anchor="middle" font-size="13" fill="#555">Paste a form,</text>
  <text x="310" y="386" text-anchor="middle" font-size="13" fill="#555">get a working schema</text>
</svg>
